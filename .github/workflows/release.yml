name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose notes should be regenerated
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      reuse: ${{ steps.validation.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Reuse only successful validation of identical code
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/resolve_validation.py --wait-seconds 1200

  validation:
    if: github.event_name == 'push' && needs.reuse.outputs.reuse != 'true'
    needs: reuse
    uses: ./.github/workflows/validate.yml

  package:
    if: github.event_name == 'push'
    uses: ./.github/workflows/platforms.yml
    with:
      artifact-prefix: fee-release
      verify-tag: true

  publish:
    if: >-
      always() && github.event_name == 'push' && needs.package.result == 'success'
      && needs.reuse.result == 'success'
      && ((needs.reuse.outputs.reuse == 'true' && needs.validation.result == 'skipped')
      || (needs.reuse.outputs.reuse != 'true' && needs.validation.result == 'success'))
    needs: [reuse, validation, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v8
        with:
          pattern: fee-release-*
          path: dist
          merge-multiple: true

      - name: Verify platform archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(<VERSION)"
          for rid in win-x64 osx-arm64 osx-x64 linux-x64; do
            test -f "dist/fee-save-editor-v$version-$rid.zip"
          done
          (cd dist && sha256sum ./*.zip > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Generate changelog and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes changelogithub@15.0.5 --to "$GITHUB_REF_NAME"

      - name: Upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber

      - name: Verify release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-download
          gh release download "$GITHUB_REF_NAME" --dir release-download
          (cd release-download && sha256sum -c SHA256SUMS)

  refresh-notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Regenerate changelog for existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: npx --yes changelogithub@15.0.5 --to "$RELEASE_TAG"
