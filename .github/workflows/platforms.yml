name: platform-packages

on:
  workflow_call:
    inputs:
      artifact-prefix:
        required: true
        type: string
      verify-tag:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify tag version
        if: inputs.verify-tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match VERSION" }
      - name: Build platform test runner
        run: dotnet build test/Gui.Smoke.csproj -c Release --nologo
      - name: Render platform pages and verify save copy
        run: dotnet test/bin/Release/net10.0/FeeEditor.Test.dll --platform-smoke
      - name: Publish GUI and CLI with a shared trimmed runtime
        run: dotnet publish gui/FeeEditor.Gui.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -o dist/gui/${{ matrix.rid }}
      - name: Package platform download
        run: python scripts/package_release.py ${{ matrix.rid }}
      - name: Test extracted release ZIP
        if: runner.os != 'Linux'
        run: python scripts/test_release_package.py ${{ matrix.rid }}
      - name: Test extracted release ZIP with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/test_release_package.py ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.rid }}
          path: dist/fee-save-editor-v*-${{ matrix.rid }}.zip
          compression-level: 0
          if-no-files-found: error
